# Конфигурация golangci-lint v2, общая для всех Go-модулей.
# Запуск: npm run backend:lint
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      # Ошибка закрытия ресурса, с которым работа уже завершена, ни на что не влияет.
      exclude-functions:
        - (io.Closer).Close
        - (net.Listener).Close
        - (*database/sql.DB).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        # Идиома `defer tx.Rollback(ctx)`: после успешного Commit откат - no-op.
        - (github.com/jackc/pgx/v5.Tx).Rollback
    gosec:
      excludes:
        # G115 (сужающее преобразование целых): значения ограничены контрактом
        # API и CHECK-ограничениями БД ещё до преобразования.
        - G115
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
