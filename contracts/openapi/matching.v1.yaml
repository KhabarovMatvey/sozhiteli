openapi: 3.0.3
info:
  title: Sozhiteli Matching API
  version: 1.0.0
  description: |
    Публичный API сервиса Matching. Отдаёт выдачу кандидатов, отфильтрованную по
    обязательным условиям текущего пользователя, и сравнение бытовых привычек.

    Matching работает на собственной проекции анкет (ADR-0004 в README.md) и никогда не
    возвращает контакты (см. Interaction API).

    Правила контракта: README.md, раздел «API».
servers:
  - url: http://localhost:8080/api/matching
    description: Локальная среда (edge-прокси из deploy/compose)
security:
  - bearerAuth: []
tags:
  - name: admin
    description: Административный просмотр данных сервиса
  - name: candidates
    description: Кандидаты и сравнение с текущим пользователем
paths:
  /v1/admin/database:
    get:
      tags: [admin]
      operationId: getAdminDatabase
      summary: Состояние собственной базы данных сервиса
      description: Доступно только пользователю с ролью sozhiteli-admin. Только чтение.
      x-implementation-status: implemented
      responses:
        '200':
          description: Размер базы и точное количество записей в разрешённых таблицах
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDatabase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/tables/{table}:
    get:
      tags: [admin]
      operationId: listAdminTableRows
      summary: Страница записей разрешённой таблицы
      description: |
        Только роль sozhiteli-admin. Таблицы доступны по фиксированному списку;
        произвольные SQL и имена таблиц не поддерживаются. Курсор относится
        к одному сервису и таблице. Контактные значения никогда не возвращаются.
      x-implementation-status: implemented
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Строки в порядке первичного ключа; значения ячеек приведены к строкам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTableRows'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: Таблица отсутствует в разрешённом списке (code = admin_table_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Error'
  /v1/candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: Выдача кандидатов для текущего пользователя
      description: |
        Только кандидаты со статусом searching, прошедшие обязательные условия:
        тот же город, пересечение бюджетов, пересечение сроков заселения,
        взаимное соблюдение предпочтения по полу соседа, совместимые сценарии
        (pair - pair; room_offer - pair с accepts_room) и одинаковые ответы на
        обязательные вопросы обеих сторон (required_habits). Сам пользователь в
        выдачу не попадает. Сортировка - по убыванию времени обновления анкеты.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
        - name: district
          in: query
          required: false
          description: |
            Оставить кандидатов, в чьих районах встречается эта строка (без учёта
            регистра). При смене фильтра выдачу начинают с первой страницы.
          schema:
            type: string
            minLength: 2
            maxLength: 50
      responses:
        '200':
          description: Страница выдачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProfileNotReady'
        default:
          $ref: '#/components/responses/Error'
  /v1/candidates/lookup:
    post:
      tags: [candidates]
      operationId: lookupCandidates
      summary: Карточки кандидатов по списку идентификаторов
      description: |
        Используется экранами запросов на контакт, чтобы получить карточки
        собеседников одним вызовом. Идентификаторы, для которых карточки нет,
        в ответе молча отсутствуют. Обязательные условия здесь НЕ фильтруют.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateLookupRequest'
      responses:
        '200':
          description: Найденные карточки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProfileNotReady'
        default:
          $ref: '#/components/responses/Error'
  /v1/candidates/{user_id}:
    get:
      tags: [candidates]
      operationId: getCandidate
      summary: Карточка кандидата с совпадениями и различиями
      description: |
        Возвращает сравнение обязательных условий и ответов анкеты. Каждый
        успешный вызов фиксируется как факт просмотра для статистики
        (ADR-0010).
      x-implementation-status: implemented
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Карточка и сравнение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Кандидат не найден (code = candidate_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/ProfileNotReady'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token OIDC-провайдера, audience = sozhiteli-api
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из next_cursor предыдущего ответа
      schema:
        type: string
        maxLength: 256
  responses:
    AdminForbidden:
      description: Требуется роль sozhiteli-admin (code = forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Запрос не соответствует схеме (code = invalid_request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Токен отсутствует или недействителен (code = unauthorized)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProfileNotReady:
      description: |
        Анкета текущего пользователя ещё не создана или ещё не доставлена в
        Matching (code = profile_not_ready). Клиент повторяет запрос позже,
        учитывая заголовок Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Любая другая ошибка в едином формате (429, 500, 501, 503)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdminDatabase:
      type: object
      required: [service, database, size_bytes, tables]
      properties:
        service:
          type: string
        database:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        tables:
          type: array
          items:
            $ref: '#/components/schemas/AdminTableSummary'
    AdminTableSummary:
      type: object
      required: [name, label, row_count, columns]
      properties:
        name:
          type: string
        label:
          type: string
        row_count:
          type: integer
          format: int64
          minimum: 0
        columns:
          type: array
          items:
            type: string
    AdminTableRows:
      type: object
      required: [table, columns, rows, next_cursor]
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        next_cursor:
          type: string
          nullable: true
    Problem:
      type: object
      description: Единый формат ошибки (RFC 9457). Клиент ветвится по полю code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    CandidatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandidateCard'
        next_cursor:
          type: string
          nullable: true
          description: null - больше страниц нет
    CandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandidateCard'
    CandidateLookupRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
    Compatibility:
      type: object
      description: Сводка сравнения анкет. Это счётчик совпадений, а не рейтинг и не рекомендация.
      required: [matched_count, compared_count]
      properties:
        matched_count:
          type: integer
          format: int32
          description: Сколько вопросов анкеты совпало
        compared_count:
          type: integer
          format: int32
          description: Сколько вопросов удалось сравнить
    CandidateCard:
      type: object
      required:
        - user_id
        - display_name
        - age
        - occupation
        - city_id
        - districts
        - budget_min_rub
        - budget_max_rub
        - move_in_from
        - move_in_to
        - search_status
        - scenario
        - accepts_room
        - place_note
        - compatibility
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        age:
          type: integer
          format: int32
        occupation:
          type: string
        city_id:
          type: integer
          format: int32
        districts:
          type: string
        budget_min_rub:
          type: integer
          format: int32
        budget_max_rub:
          type: integer
          format: int32
        move_in_from:
          type: string
          format: date
        move_in_to:
          type: string
          format: date
        search_status:
          type: string
          enum: [searching, paused, found]
        scenario:
          type: string
          description: |
            pair - ищет соседа для совместной аренды; room_offer - предлагает
            свободное место в уже снятой квартире (тогда budget_min_rub =
            budget_max_rub = аренда за место в месяц)
          enum: [pair, room_offer]
        accepts_room:
          type: boolean
          description: pair готов заехать на свободное место в уже снятой квартире
        utilities_rub:
          type: integer
          format: int32
          description: Только room_offer - коммунальные на человека в месяц
        deposit_rub:
          type: integer
          format: int32
          description: Только room_offer - залог при заселении
        place_note:
          type: string
          description: Только room_offer - о квартире и месте; иначе пустая строка
        compatibility:
          $ref: '#/components/schemas/Compatibility'
    ConditionsComparison:
      type: object
      description: Сравнение обязательных условий с условиями текущего пользователя
      required: [same_city, budget_overlap, move_in_overlap, roommate_gender_ok, scenario_ok, required_habits_ok]
      properties:
        same_city:
          type: boolean
        budget_overlap:
          type: boolean
        move_in_overlap:
          type: boolean
        roommate_gender_ok:
          type: boolean
          description: Предпочтения обоих по полу соседа соблюдены
        scenario_ok:
          type: boolean
          description: Сценарии совместимы (pair - pair; room_offer - pair с accepts_room)
        required_habits_ok:
          type: boolean
          description: По обязательным вопросам обеих сторон нет разных ответов
    HabitComparison:
      type: object
      required: [question_code, result]
      properties:
        question_code:
          type: string
        my_option:
          type: string
          description: Код моего ответа; отсутствует, если я на вопрос не отвечал
        their_option:
          type: string
          description: Код ответа кандидата; отсутствует, если кандидат не отвечал
        result:
          type: string
          description: |
            match - ответы одинаковые; difference - разные; not_comparable - у
            одной из сторон нет ответа (анкеты разных версий)
          enum: [match, difference, not_comparable]
        required_by_me:
          type: boolean
          description: Вопрос обязателен для текущего пользователя
        required_by_them:
          type: boolean
          description: Вопрос обязателен для кандидата
    CandidateDetail:
      type: object
      required: [card, conditions, habits]
      properties:
        card:
          $ref: '#/components/schemas/CandidateCard'
        conditions:
          $ref: '#/components/schemas/ConditionsComparison'
        habits:
          type: array
          items:
            $ref: '#/components/schemas/HabitComparison'
