openapi: 3.0.3
info:
  title: Sozhiteli Profile API
  version: 1.0.0
  description: |
    Публичный API сервиса Profile. Владеет анкетой пользователя: обязательными
    условиями поиска и ответами на вопросы о бытовых привычках.

    Profile НЕ хранит контакты (см. Interaction API) и НЕ отдаёт чужие анкеты
    (карточки кандидатов отдаёт Matching API).

    Правила контракта: README.md, раздел «API».
servers:
  - url: http://localhost:8080/api/profile
    description: Локальная среда (edge-прокси из deploy/compose)
security:
  - bearerAuth: []
tags:
  - name: reference
    description: Справочные данные для заполнения анкеты
  - name: profile
    description: Собственная анкета текущего пользователя
  - name: admin
    description: Просмотр и изменение данных администратором с ролью sozhiteli-admin
paths:
  /v1/admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: Все зарегистрированные учётные записи
      description: Только роль sozhiteli-admin. Данные читает сервис через Keycloak Admin REST с правами view-users. Сервисные учётные записи, если их возвращает провайдер, отмечены отдельно.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/AdminCursor'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Страница учётных записей, включая ещё не заполнивших анкету
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/database:
    get:
      tags: [admin]
      operationId: getAdminDatabase
      summary: Размер базы Profile и число строк в разрешённых таблицах
      x-implementation-status: implemented
      responses:
        '200':
          description: Сводка своей базы без SQL-доступа и реквизитов подключения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDatabase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/tables/{table}:
    get:
      tags: [admin]
      operationId: listAdminTableRows
      summary: Строки разрешённой таблицы Profile
      x-implementation-status: implemented
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [profile, city, profile_deletion]
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/AdminCursor'
      responses:
        '200':
          description: Строки в порядке первичного ключа; значения представлены строками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTableRows'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/profiles:
    get:
      tags: [admin]
      operationId: listAdminProfiles
      summary: Все анкеты пользователей
      description: |
        Только роль sozhiteli-admin. Порядок - по идентификатору пользователя.
        Поиск совпадает с частью имени без учёта регистра или с полным
        идентификатором пользователя.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/AdminCursor'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Страница анкет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/users/{user_id}/profile:
    parameters:
      - name: user_id
        in: path
        required: true
        description: Идентификатор пользователя (claim sub токена Keycloak)
        schema:
          type: string
          format: uuid
    get:
      tags: [admin]
      operationId: getAdminProfile
      summary: Анкета пользователя
      description: Только роль sozhiteli-admin.
      x-implementation-status: implemented
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Анкета ещё не создана (code = profile_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [admin]
      operationId: putAdminProfile
      summary: Создать или заменить анкету пользователя
      description: |
        Только роль sozhiteli-admin. Правила проверки те же, что у собственной
        анкеты. Создать анкету можно только для учётной записи, существующей в
        Keycloak (иначе code = user_not_found). Замена существующей анкеты
        учётную запись не проверяет.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Сохранённая анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Учётной записи с таким идентификатором нет (code = user_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin]
      operationId: deleteAdminProfile
      summary: Удалить анкету пользователя
      description: |
        Только роль sozhiteli-admin. Удаляется только анкета. Учётная запись в
        Keycloak, контакт и запросы на контакт остаются. Из выдачи анкета
        исчезает в пределах интервала синхронизации.
      x-implementation-status: implemented
      responses:
        '204':
          description: Анкета удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Анкеты нет (code = profile_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Error'
  /v1/questionnaire:
    get:
      tags: [reference]
      operationId: getQuestionnaire
      summary: Действующая версия анкеты бытовых привычек
      description: |
        Возвращает вопросы и варианты ответов. Клиент использует коды из этого
        ответа при отправке анкеты и для подписи кодов, которые приходят из
        Matching API.
      x-implementation-status: implemented
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questionnaire'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/cities:
    get:
      tags: [reference]
      operationId: listCities
      summary: Города, в которых доступен поиск
      description: |
        Все города России (около 1100), отсортированные по названию, затем по
        региону. Список меняется редко: клиент загружает его один раз и ищет
        по нему локально. Пагинации нет.
      x-implementation-status: implemented
      responses:
        '200':
          description: Список городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: Анкета текущего пользователя
      x-implementation-status: implemented
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Анкета ещё не создана (code = profile_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [profile]
      operationId: putMyProfile
      summary: Создать или полностью заменить анкету текущего пользователя
      description: |
        Идемпотентная операция. Анкета принимается только целиком: частично
        заполненных анкет не существует.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Сохранённая анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    AdminLimit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
    AdminCursor:
      name: cursor
      in: query
      description: Непрозрачный курсор предыдущей страницы; связан с таблицей или поиском
      schema:
        type: string
        minLength: 1
        maxLength: 1024
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token OIDC-провайдера, audience = sozhiteli-api
  responses:
    Forbidden:
      description: Требуется роль sozhiteli-admin (code = forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Запрос не соответствует схеме (code = invalid_request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Токен отсутствует или недействителен (code = unauthorized)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Запрос корректен по схеме, но нарушает бизнес-правило (code = validation_failed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Любая другая ошибка в едином формате (429, 500, 501, 503)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, email, enabled, email_verified, created_at, service_account, has_profile]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        enabled:
          type: boolean
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        service_account:
          type: boolean
        has_profile:
          type: boolean
          description: Есть ли у учётной записи анкета в Profile
    AdminUserList:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          format: int64
          minimum: 0
          description: Число учётных записей, возвращаемых Keycloak с тем же поисковым фильтром
        next_cursor:
          type: string
          nullable: true
    AdminProfileList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        next_cursor:
          type: string
          nullable: true
    AdminDatabase:
      type: object
      required: [service, database, size_bytes, tables]
      properties:
        service:
          type: string
          enum: [profile]
        database:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        tables:
          type: array
          items:
            $ref: '#/components/schemas/AdminTableSummary'
    AdminTableSummary:
      type: object
      required: [name, label, row_count, columns]
      properties:
        name:
          type: string
        label:
          type: string
        row_count:
          type: integer
          format: int64
          minimum: 0
        columns:
          type: array
          items:
            type: string
    AdminTableRows:
      type: object
      required: [table, columns, rows, next_cursor]
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        next_cursor:
          type: string
          nullable: true
    Problem:
      type: object
      description: Единый формат ошибки (RFC 9457). Клиент ветвится по полю code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: urn:sozhiteli:problem:validation_failed
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          description: Стабильный машинно-читаемый код ошибки
          example: validation_failed
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: budget_max_rub
        code:
          type: string
          example: out_of_range
        message:
          type: string
    Questionnaire:
      type: object
      required: [version, questions]
      properties:
        version:
          type: integer
          format: int32
          description: Версия анкеты. Передаётся обратно в ProfileInput.questionnaire_version.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    Question:
      type: object
      required: [code, title, options]
      properties:
        code:
          type: string
          example: guests
        title:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOption'
    QuestionOption:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          example: with_notice
        label:
          type: string
    CityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    City:
      type: object
      required: [id, name, region]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          example: Советск
        region:
          type: string
          description: |
            Субъект РФ. Различает города-тёзки и показывается рядом с названием.
            У городов федерального значения совпадает с name.
          example: Калининградская область
    Gender:
      type: string
      enum: [female, male]
    RoommateGender:
      type: string
      description: any — пол соседа не важен; same — только сосед того же пола
      enum: [any, same]
    Scenario:
      type: string
      description: |
        pair - ищу соседа, чтобы вместе снять квартиру (сегмент 1);
        room_offer - уже снимаю квартиру и ищу жильца на свободное место
        (сегмент 2). Для room_offer budget_min_rub = budget_max_rub = аренда
        за место в месяц, move_in_from..move_in_to - когда место свободно.
      default: pair
      enum: [pair, room_offer]
    SearchStatus:
      type: string
      description: |
        searching — анкета показывается кандидатам; paused — поиск на паузе,
        анкета скрыта из выдачи; found — сосед найден, поиск завершён,
        анкета скрыта из выдачи
      enum: [searching, paused, found]
    ProfileInput:
      type: object
      required:
        - display_name
        - birth_year
        - gender
        - occupation
        - city_id
        - districts
        - budget_min_rub
        - budget_max_rub
        - move_in_from
        - move_in_to
        - roommate_gender
        - questionnaire_version
        - habits
        - search_status
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 40
        birth_year:
          type: integer
          format: int32
          minimum: 1930
          maximum: 2100
          description: Год рождения. Пользователь должен быть совершеннолетним (проверяется сервером).
        gender:
          $ref: '#/components/schemas/Gender'
        occupation:
          type: string
          minLength: 2
          maxLength: 80
          description: Место учёбы или род занятий
        city_id:
          type: integer
          format: int32
        districts:
          type: string
          maxLength: 200
          description: Подходящие районы свободным текстом; может быть пустой строкой
        budget_min_rub:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Нижняя граница доли аренды на человека в месяц, без коммунальных платежей
        budget_max_rub:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Верхняя граница доли аренды на человека в месяц, без коммунальных платежей
        move_in_from:
          type: string
          format: date
        move_in_to:
          type: string
          format: date
        roommate_gender:
          $ref: '#/components/schemas/RoommateGender'
        questionnaire_version:
          type: integer
          format: int32
        habits:
          type: object
          description: Ответы на анкету - код вопроса -> код варианта. Обязательны все вопросы версии.
          additionalProperties:
            type: string
          example:
            smoking: 'no'
            guests: with_notice
        search_status:
          $ref: '#/components/schemas/SearchStatus'
        scenario:
          $ref: '#/components/schemas/Scenario'
        accepts_room:
          type: boolean
          default: false
          description: |
            Только для scenario = pair: готов(а) заехать на свободное место в уже
            снятой квартире. Тогда в выдаче появляются и анкеты room_offer.
        utilities_rub:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Только room_offer, обязательно - коммунальные платежи на человека в месяц, примерно
        deposit_rub:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Только room_offer, обязательно - залог при заселении
        place_note:
          type: string
          maxLength: 500
          description: Только room_offer - о квартире и свободном месте; контакты запрещены
        required_habits:
          type: array
          maxItems: 16
          uniqueItems: true
          description: |
            Коды вопросов анкеты, по которым нужен тот же ответ. Кандидат с другим
            ответом не попадает в выдачу (в обе стороны); не ответивший - попадает.
          items:
            type: string
    Profile:
      type: object
      required:
        - user_id
        - display_name
        - birth_year
        - gender
        - occupation
        - city_id
        - districts
        - budget_min_rub
        - budget_max_rub
        - move_in_from
        - move_in_to
        - roommate_gender
        - questionnaire_version
        - habits
        - search_status
        - scenario
        - accepts_room
        - place_note
        - required_habits
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        birth_year:
          type: integer
          format: int32
        gender:
          $ref: '#/components/schemas/Gender'
        occupation:
          type: string
        city_id:
          type: integer
          format: int32
        districts:
          type: string
        budget_min_rub:
          type: integer
          format: int32
        budget_max_rub:
          type: integer
          format: int32
        move_in_from:
          type: string
          format: date
        move_in_to:
          type: string
          format: date
        roommate_gender:
          $ref: '#/components/schemas/RoommateGender'
        questionnaire_version:
          type: integer
          format: int32
        habits:
          type: object
          additionalProperties:
            type: string
        search_status:
          $ref: '#/components/schemas/SearchStatus'
        scenario:
          $ref: '#/components/schemas/Scenario'
        accepts_room:
          type: boolean
        utilities_rub:
          type: integer
          format: int32
        deposit_rub:
          type: integer
          format: int32
        place_note:
          type: string
        required_habits:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
