openapi: 3.0.3
info:
  title: Sozhiteli Profile API
  version: 1.0.0
  description: |
    Публичный API сервиса Profile. Владеет анкетой пользователя: обязательными
    условиями поиска и ответами на вопросы о бытовых привычках.

    Profile НЕ хранит контакты (см. Interaction API) и НЕ отдаёт чужие анкеты
    (карточки кандидатов отдаёт Matching API).

    Правила контракта: README.md, раздел «API».
servers:
  - url: http://localhost:8080/api/profile
    description: Локальная среда (edge-прокси из deploy/compose)
security:
  - bearerAuth: []
tags:
  - name: reference
    description: Справочные данные для заполнения анкеты
  - name: profile
    description: Собственная анкета текущего пользователя
paths:
  /v1/questionnaire:
    get:
      tags: [reference]
      operationId: getQuestionnaire
      summary: Действующая версия анкеты бытовых привычек
      description: |
        Возвращает вопросы и варианты ответов. Клиент использует коды из этого
        ответа при отправке анкеты и для подписи кодов, которые приходят из
        Matching API.
      x-implementation-status: implemented
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questionnaire'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/cities:
    get:
      tags: [reference]
      operationId: listCities
      summary: Города, в которых доступен поиск
      description: |
        Все города России (около 1100), отсортированные по названию, затем по
        региону. Список меняется редко: клиент загружает его один раз и ищет
        по нему локально. Пагинации нет.
      x-implementation-status: implemented
      responses:
        '200':
          description: Список городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: Анкета текущего пользователя
      x-implementation-status: implemented
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Анкета ещё не создана (code = profile_not_found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [profile]
      operationId: putMyProfile
      summary: Создать или полностью заменить анкету текущего пользователя
      description: |
        Идемпотентная операция. Анкета принимается только целиком: частично
        заполненных анкет не существует.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Сохранённая анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token OIDC-провайдера, audience = sozhiteli-api
  responses:
    BadRequest:
      description: Запрос не соответствует схеме (code = invalid_request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Токен отсутствует или недействителен (code = unauthorized)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Запрос корректен по схеме, но нарушает бизнес-правило (code = validation_failed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Любая другая ошибка в едином формате (429, 500, 501, 503)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Единый формат ошибки (RFC 9457). Клиент ветвится по полю code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: urn:sozhiteli:problem:validation_failed
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          description: Стабильный машинно-читаемый код ошибки
          example: validation_failed
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: budget_max_rub
        code:
          type: string
          example: out_of_range
        message:
          type: string
    Questionnaire:
      type: object
      required: [version, questions]
      properties:
        version:
          type: integer
          format: int32
          description: Версия анкеты. Передаётся обратно в ProfileInput.questionnaire_version.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    Question:
      type: object
      required: [code, title, options]
      properties:
        code:
          type: string
          example: guests
        title:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOption'
    QuestionOption:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          example: with_notice
        label:
          type: string
    CityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    City:
      type: object
      required: [id, name, region]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          example: Советск
        region:
          type: string
          description: |
            Субъект РФ. Различает города-тёзки и показывается рядом с названием.
            У городов федерального значения совпадает с name.
          example: Калининградская область
    Gender:
      type: string
      enum: [female, male]
    RoommateGender:
      type: string
      description: any — пол соседа не важен; same — только сосед того же пола
      enum: [any, same]
    SearchStatus:
      type: string
      description: searching — анкета показывается кандидатам; paused — скрыта из выдачи
      enum: [searching, paused]
    ProfileInput:
      type: object
      required:
        - display_name
        - birth_year
        - gender
        - occupation
        - city_id
        - districts
        - budget_min_rub
        - budget_max_rub
        - move_in_from
        - move_in_to
        - roommate_gender
        - questionnaire_version
        - habits
        - search_status
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 40
        birth_year:
          type: integer
          format: int32
          minimum: 1930
          maximum: 2100
          description: Год рождения. Пользователь должен быть совершеннолетним (проверяется сервером).
        gender:
          $ref: '#/components/schemas/Gender'
        occupation:
          type: string
          minLength: 2
          maxLength: 80
          description: Место учёбы или род занятий
        city_id:
          type: integer
          format: int32
        districts:
          type: string
          maxLength: 200
          description: Подходящие районы свободным текстом; может быть пустой строкой
        budget_min_rub:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Нижняя граница доли аренды на человека в месяц, без коммунальных платежей
        budget_max_rub:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Верхняя граница доли аренды на человека в месяц, без коммунальных платежей
        move_in_from:
          type: string
          format: date
        move_in_to:
          type: string
          format: date
        roommate_gender:
          $ref: '#/components/schemas/RoommateGender'
        questionnaire_version:
          type: integer
          format: int32
        habits:
          type: object
          description: Ответы на анкету - код вопроса -> код варианта. Обязательны все вопросы версии.
          additionalProperties:
            type: string
          example:
            smoking: 'no'
            guests: with_notice
        search_status:
          $ref: '#/components/schemas/SearchStatus'
    Profile:
      type: object
      required:
        - user_id
        - display_name
        - birth_year
        - gender
        - occupation
        - city_id
        - districts
        - budget_min_rub
        - budget_max_rub
        - move_in_from
        - move_in_to
        - roommate_gender
        - questionnaire_version
        - habits
        - search_status
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        birth_year:
          type: integer
          format: int32
        gender:
          $ref: '#/components/schemas/Gender'
        occupation:
          type: string
        city_id:
          type: integer
          format: int32
        districts:
          type: string
        budget_min_rub:
          type: integer
          format: int32
        budget_max_rub:
          type: integer
          format: int32
        move_in_from:
          type: string
          format: date
        move_in_to:
          type: string
          format: date
        roommate_gender:
          $ref: '#/components/schemas/RoommateGender'
        questionnaire_version:
          type: integer
          format: int32
        habits:
          type: object
          additionalProperties:
            type: string
        search_status:
          $ref: '#/components/schemas/SearchStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
