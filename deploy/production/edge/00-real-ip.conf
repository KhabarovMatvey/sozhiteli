# Edge стоит за Caddy. Без этого все запросы пришли бы с адреса Caddy и
# ограничение частоты по IP (limit_req) делило бы один лимит на всех.
# Заголовку X-Forwarded-For верим только от Caddy (адрес задан в compose.yaml).
set_real_ip_from 172.31.250.10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
